    Research Experience:
      - company: School of Physical and Mathematical Sciences, Nanyang Technological University (NTU)
        position: Visiting Research Student
        location: Singapore
        start_date: 2026-01
        end_date: 2026-04
        summary: "Supervisor: Prof. Baile Zhang. Terahertz chiral valley edge states in magneto-optic photonic crystals."
        highlights:
          - Designed and numerically validated a fabrication-compatible terahertz Chern-valley photonic-crystal interface supporting chiral, valley-selective edge modes.
          - Built 2D and 3D COMSOL bulk-band and supercell models to identify overlapping topological gaps and interface-localized modes.
          - Evaluated magnetic bias, fabrication tolerances, and finite air-layer effects, and optimized the structure for subsequent fabrication and experiments by NTU collaborators.

      - company: Topological Physics Research Group, Department of EEE, SUSTech
        position: Undergraduate Research Assistant
        location: Shenzhen, China
        start_date: 2025-02
        end_date: present
        summary: "Supervisor: Prof. Zhen Gao. Pseudospin-locked chiral edge states in gyromagnetic photonic crystals; gauge-field-induced duality and Hofstadter photonic lattices; cavity-tunable Dirac phases and ongoing refraction studies in a microwave metasurface."
        highlights:
          - Led full-wave modeling and sample design for a microwave gyromagnetic photonic crystal supporting pseudospin-locked chiral edge transport under broken time-reversal symmetry.
          - Identified QSH-like, QAH-like, and trivial phases through bulk and projected band structures, p-d band inversion, pseudospin-resolved eigenfields, and spin Chern numbers.
          - Designed measurement configurations and participated in VNA transmission and near-field mapping; measurements showed ~20 dB directional transmission contrast within the bandgap and pseudospin-selective excitation of the chiral edge mode.
          - Designed a pseudospin multiplexer/demultiplexer and a low-crosstalk waveguide crossing based on the coexistence of multiple topological phases.
          - Developed tight-binding and full-wave models of gauge-flux-engineered dual and self-dual photonic crystals; verified spectral equivalence and self-duality-related degeneracies.
          - Investigated rotation-dependent couplings between higher-order modes and Hofstadter-butterfly-like spectra through modulated hopping.
          - Built finite-array models and MATLAB workflows for spectral analysis and Fourier-based reconstruction.
          - Participated in sublattice-resolved VNA measurements of complex transmission in a cavity-embedded honeycomb metasurface, supporting reconstruction of pseudospin textures and characterization of Dirac-point winding numbers.
          - Investigating cavity-controlled refraction using MATLAB and COMSOL band structures, equifrequency contours, and phase matching, including candidate single- and dual-channel responses at fixed frequency and incidence angle.

