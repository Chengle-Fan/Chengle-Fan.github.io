    Research Experience:
      - company: Artificial Microstructure Physics Research Group, SUSTech
        position: Undergraduate Research Assistant
        location: Shenzhen, China
        start_date: 2025-02
        end_date: present
        summary: "Supervisor: Prof. Zhen Gao. Pseudospin-locked chiral edge states and photonic routing; cavity-controlled photonic systems; exploratory modeling of gauge-field photonic lattices."
        highlights:
          - Led full-wave modeling and sample design of a gyromagnetic photonic crystal; characterized its topological phases using band inversion, pseudospin-resolved eigenfields, and spin Chern numbers.
          - Designed measurement configurations and participated in most VNA transmission and near-field experiments, demonstrating approximately 20 dB directional transmission contrast and pseudospin-selective edge-mode excitation within the bandgap.
          - Designed a pseudospin multiplexer/demultiplexer and a low-crosstalk waveguide crossing; wrote the manuscript and prepared all figures.
          - Contributed to sublattice-resolved VNA measurements of cavity-tunable Dirac phases, supporting pseudospin-texture reconstruction and winding-number characterization; co-first author on the manuscript.
          - Investigating cavity-controlled refraction through MATLAB analysis of simulated bands, isofrequency contours, and interface phase matching, identifying candidate operating conditions for reconfigurable beam routing.
          - Developed tight-binding and full-wave models to explore gauge-field-induced duality and Hofstadter-type spectra in photonic lattices.
          - Contributed to experiments on cavity-controlled helical edge transport and to revision measurements for a study of cavity-tunable exceptional points.

      - company: Nanyang Technological University (NTU)
        position: Visiting Research Student
        location: Singapore
        start_date: "Jan. 12, 2026"
        end_date: "Apr. 27, 2026"
        summary: "Supervisor: Prof. Baile Zhang. Terahertz chiral valley edge states."
        highlights:
          - Developed 2D and 3D COMSOL models of terahertz Chern–valley interfaces to evaluate overlapping bulk bandgaps and interface-localized modes.
          - Optimized a magneto-optic slab geometry while assessing magnetic bias, fabrication tolerances, and finite air-layer effects.

